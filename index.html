<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd9ec">
<title>다이어터 연금술사</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- ── 헤더 ── -->
  <header class="app-header">
    <div class="app-title">🧪 다이어터 연금술사</div>
    <div class="header-charm">
      <span id="hdrTier" class="hdr-tier">🌱 새싹</span>
      <span id="hdrCharm" class="hdr-charm">💖 0</span>
    </div>
  </header>

  <!-- ── 채집 화면 ── -->
  <section id="screen-gather" class="screen active">
    <h2 class="screen-title">🌿 채집</h2>
    <p class="screen-sub">장소를 눌러 연금술 재료를 모으세요.</p>
    <div id="spotList" class="spot-list"></div>
  </section>

  <!-- ── 공방 화면 ── -->
  <section id="screen-atelier" class="screen">
    <h2 class="screen-title">⚗️ 공방</h2>
    <p class="screen-sub">재료를 가마솥에 넣고 조합해 새 레시피를 발견하세요.</p>

    <div class="cauldron">
      <div class="cauldron-top">🫕</div>
      <div id="cauldronSlots" class="cauldron-slots"></div>
      <div class="cauldron-actions">
        <button class="btn btn-ghost" onclick="clearCauldron()">비우기</button>
        <button class="btn btn-primary" onclick="brew()">✨ 조합하기</button>
      </div>
    </div>

    <h3 class="mini-title">🎒 재료 가방</h3>
    <div id="ingredientBag" class="ingredient-bag"></div>

    <div class="recipe-book-head">
      <h3 class="mini-title">📖 레시피 북</h3>
      <span id="recipeProgress" class="recipe-progress">0 / 0</span>
    </div>
    <div id="recipeBook" class="recipe-book"></div>
  </section>

  <!-- ── 쇼케이스 화면 ── -->
  <section id="screen-showcase" class="screen">
    <h2 class="screen-title">✨ 나의 방</h2>

    <div id="charStage" class="char-stage"></div>
    <div id="showcaseTier" class="showcase-tier">🌱 새싹</div>

    <div class="stat-row">
      <div class="stat-box"><div class="stat-label">✨ 비주얼</div><div id="statBeauty" class="stat-val">0</div></div>
      <div class="stat-box"><div class="stat-label">💖 아우라</div><div id="statCharm" class="stat-val">0</div></div>
      <div class="stat-box highlight"><div class="stat-label">🌟 매력 총합</div><div id="statTotal" class="stat-val">0</div></div>
    </div>

    <button class="btn btn-flex" onclick="flexCharm()">📢 매력 과시</button>

    <h3 class="mini-title">👗 옷장 <span class="hint">(눌러서 갈아입기)</span></h3>
    <div id="wardrobe" class="wardrobe"></div>

    <h3 class="mini-title">🧴 보유 물약 <span class="hint">(눌러서 마시기)</span></h3>
    <div id="potionShelf" class="potion-shelf"></div>

    <h3 class="mini-title">🦋 크리처 컬렉션</h3>
    <div id="creatureCollection" class="creature-collection"></div>

    <button class="btn btn-reset" onclick="resetGame()">처음부터 다시</button>
  </section>

  <!-- ── 하단 탭 ── -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="gather"><span class="tab-icon">🌿</span>채집</button>
    <button class="tab-btn" data-tab="atelier"><span class="tab-icon">⚗️</span>공방</button>
    <button class="tab-btn" data-tab="showcase"><span class="tab-icon">✨</span>나의 방</button>
  </nav>
</div>

<!-- ── 조합 결과 모달 ── -->
<div id="brewModal" class="modal">
  <div class="modal-card">
    <div id="brewModalBody"></div>
    <button class="btn btn-primary" onclick="closeBrewModal()">확인</button>
  </div>
</div>

<!-- ── 토스트 ── -->
<div id="toast" class="toast"></div>

<script src="data.js"></script>
<script src="avatar.js"></script>
<script src="sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
