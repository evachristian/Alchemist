<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd9ec">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>다이어터 연금술사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260803p">
</head>
<body>

<div class="app">
  <!-- ── 상단바 (헤더 + 에너지) ── -->
  <div class="topbar">
    <header class="app-header">
      <div class="ap-wrap">
        <span class="en-ic">⚡</span>
        <span class="ap-label">AP</span>
        <div class="en-track">
          <div id="enFill" class="en-fill"></div>
          <span id="enText" class="en-text">0/0</span>
        </div>
        <button class="ap-help" onclick="apHelp()" aria-label="AP 안내">?</button>
      </div>
      <div class="header-charm">
        <span id="hdrTier" class="hdr-tier">🌱 새싹</span>
        <span id="hdrCharm" class="hdr-charm">🌟 0</span>
      </div>
    </header>
    <div class="clock-bar">
      <span id="clockKST" class="clock-item"></span>
    </div>
  </div>

  <!-- ── 채집 화면 ── -->
  <section id="screen-gather" class="screen">
    <h2 class="screen-title">🌿 채집</h2>
    <p class="screen-sub">장소를 눌러 연금술 재료를 모으세요.</p>
    <div id="spotList" class="spot-list"></div>
  </section>

  <!-- ── 공방 화면 ── -->
  <section id="screen-atelier" class="screen">
    <h2 class="screen-title">⚗️ 공방</h2>
    <p class="screen-sub">재료를 가마솥에 넣고 조합해 새 레시피를 발견하세요.</p>

    <div class="cauldron">
      <div class="cauldron-top">
        <svg class="cauldron-svg" viewBox="0 0 200 198" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="연금술 가마솥">
          <defs>
            <radialGradient id="bodyG" cx="0.38" cy="0.3" r="0.9">
              <stop offset="0" stop-color="#544d5c"/><stop offset="0.55" stop-color="#332e3a"/><stop offset="1" stop-color="#1b1822"/>
            </radialGradient>
            <linearGradient id="brassG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ecca72"/><stop offset="0.5" stop-color="#b8912f"/><stop offset="1" stop-color="#7d5f1f"/>
            </linearGradient>
            <radialGradient id="brewG" cx="0.5" cy="0.5" r="0.62">
              <stop offset="0" stop-color="#efb0f4"/><stop offset="0.45" stop-color="#b662d0"/><stop offset="1" stop-color="#5b2a74"/>
            </radialGradient>
            <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.6">
              <stop offset="0" stop-color="rgba(242,184,255,0.9)"/><stop offset="1" stop-color="rgba(242,184,255,0)"/>
            </radialGradient>
          </defs>
          <!-- 그림자 -->
          <ellipse cx="100" cy="191" rx="72" ry="7" fill="rgba(80,60,40,0.16)"/>
          <!-- 뒤쪽 다리 2개 -->
          <g fill="url(#brassG)" stroke="#5a4420" stroke-width="1.5" stroke-linejoin="round">
            <path d="M54,150 C45,164 41,178 49,186 L66,186 C63,173 63,160 68,150 Z"/>
            <path d="M146,150 C155,164 159,178 151,186 L134,186 C137,173 137,160 132,150 Z"/>
          </g>
          <!-- 몸통 -->
          <ellipse cx="100" cy="114" rx="76" ry="64" fill="url(#bodyG)"/>
          <ellipse cx="66" cy="82" rx="20" ry="30" fill="#5f5768" opacity="0.35" transform="rotate(-20 66 82)"/>
          <!-- 측면 고리 손잡이 -->
          <g stroke="url(#brassG)" fill="none" stroke-width="6">
            <ellipse cx="23" cy="80" rx="12" ry="16"/>
            <ellipse cx="177" cy="80" rx="12" ry="16"/>
          </g>
          <rect x="29" y="58" width="15" height="13" rx="3" fill="url(#brassG)" stroke="#5a4420" stroke-width="1"/>
          <rect x="156" y="58" width="15" height="13" rx="3" fill="url(#brassG)" stroke="#5a4420" stroke-width="1"/>
          <!-- 놋쇠 테두리 밴드 -->
          <ellipse cx="100" cy="65" rx="70" ry="23" fill="#6b5426"/>
          <ellipse cx="100" cy="60" rx="70" ry="23" fill="url(#brassG)"/>
          <g fill="#7d5f1f">
            <circle cx="46" cy="68" r="2.4"/><circle cx="64" cy="76" r="2.6"/><circle cx="84" cy="80" r="2.6"/>
            <circle cx="116" cy="80" r="2.6"/><circle cx="136" cy="76" r="2.6"/><circle cx="154" cy="68" r="2.4"/>
          </g>
          <!-- 개구부(내부 어둠) -->
          <ellipse cx="100" cy="57" rx="56" ry="16" fill="#241b2e"/>
          <!-- 물약(보라 발광) -->
          <ellipse cx="100" cy="57" rx="52" ry="14" fill="url(#brewG)"/>
          <ellipse class="brew-glow" cx="100" cy="55" rx="40" ry="10.5" fill="url(#glowP)"/>
          <g clip-path="url(#brewClip)">
            <circle class="bub" style="animation-delay:0s"    cx="80"  cy="58" r="3.2" fill="#f4d9fb"/>
            <circle class="bub" style="animation-delay:0.5s"  cx="106" cy="54" r="2.4" fill="#f4d9fb"/>
            <circle class="bub" style="animation-delay:1s"    cx="124" cy="59" r="2.8" fill="#f4d9fb"/>
            <circle class="bub" style="animation-delay:1.5s"  cx="90"  cy="60" r="2"   fill="#f4d9fb"/>
            <circle class="bub" style="animation-delay:2s"    cx="132" cy="55" r="2"   fill="#f4d9fb"/>
          </g>
          <clipPath id="brewClip"><ellipse cx="100" cy="57" rx="52" ry="14"/></clipPath>
          <g fill="#fff">
            <circle class="twinkle" style="animation-delay:0s"   cx="86"  cy="52" r="1.5"/>
            <circle class="twinkle" style="animation-delay:0.6s" cx="112" cy="50" r="1.7"/>
            <circle class="twinkle" style="animation-delay:1.1s" cx="128" cy="55" r="1.3"/>
            <circle class="twinkle" style="animation-delay:1.7s" cx="98"  cy="53" r="1.2"/>
          </g>
          <!-- 전면 메달리온 -->
          <ellipse cx="100" cy="94" rx="19" ry="16" fill="url(#brassG)" stroke="#5a4420" stroke-width="1.5"/>
          <ellipse cx="100" cy="94" rx="13" ry="10.5" fill="#8a6a24"/>
          <path d="M100,86 C97,90 97,93 100,95 C103,93 103,90 100,86 Z" fill="url(#brassG)"/>
          <path d="M92,92 C95,92 98,94 100,98 C97,99 92,97 92,92 Z M108,92 C105,92 102,94 100,98 C103,99 108,97 108,92 Z" fill="url(#brassG)"/>
          <rect x="98.7" y="94" width="2.6" height="8" rx="1" fill="url(#brassG)"/>
          <!-- 앞쪽 가운데 다리 -->
          <path d="M87,166 C85,179 89,188 100,188 C111,188 115,179 113,166 C108,170 92,170 87,166 Z" fill="url(#brassG)" stroke="#5a4420" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M100,170 L100,184 M95,176 L105,176" stroke="#6a501c" stroke-width="1.4" fill="none"/>
        </svg>
      </div>
      <div class="magic-circle">
        <div class="mc-ring">
          <svg class="mc-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <radialGradient id="discG" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#3a2c56"/><stop offset="0.82" stop-color="#271f3e"/><stop offset="1" stop-color="rgba(26,20,40,0)"/>
              </radialGradient>
              <radialGradient id="mcGlowG" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="rgba(200,120,230,0.4)"/><stop offset="1" stop-color="rgba(200,120,230,0)"/>
              </radialGradient>
            </defs>
            <circle cx="120" cy="120" r="116" fill="url(#discG)"/>
            <circle class="mc-core" cx="120" cy="120" r="72" fill="url(#mcGlowG)"/>
            <g class="mc-spin" fill="none" stroke="#c9a24a" stroke-width="1.5">
              <circle cx="120" cy="120" r="106" stroke-width="2"/>
              <circle cx="120" cy="120" r="99"/>
              <circle cx="120" cy="120" r="103" stroke="#dab55e" stroke-width="6" stroke-dasharray="1.5 7" opacity="0.7"/>
              <circle cx="120" cy="120" r="54"/>
              <circle cx="120" cy="120" r="28" opacity="0.8"/>
              <path d="M120,30 L197.9,165 L42.1,165 Z"/>
              <path d="M120,210 L42.1,75 L197.9,75 Z"/>
              <g fill="#dab55e" stroke="none">
                <circle cx="120" cy="30" r="3.6"/><circle cx="197.9" cy="165" r="3.6"/><circle cx="42.1" cy="165" r="3.6"/>
                <circle cx="120" cy="210" r="3.6"/><circle cx="42.1" cy="75" r="3.6"/><circle cx="197.9" cy="75" r="3.6"/>
              </g>
              <circle cx="120" cy="120" r="10"/><circle cx="120" cy="120" r="2.6" fill="#c9a24a" stroke="none"/>
            </g>
          </svg>
        </div>
        <div id="cauldronSlots" class="cauldron-slots"></div>
      </div>
      <div class="cauldron-actions">
        <button class="btn btn-ghost" onclick="clearCauldron()">비우기</button>
        <button class="btn btn-primary" onclick="brew()">✨ 조합하기 <span id="brewCost" class="btn-cost"></span></button>
      </div>
    </div>

    <h3 class="mini-title bag-toggle" onclick="toggleBag()">
      <span>🎒 채집 가방</span>
      <span id="bagCount" class="bag-count"></span>
      <span id="bagChevron" class="bag-chevron">▸</span>
    </h3>
    <div id="ingredientBag" class="ingredient-bag"></div>

    <div class="recipe-book-head">
      <h3 class="mini-title">📖 레시피 북</h3>
      <span id="recipeProgress" class="recipe-progress">0 / 0</span>
    </div>
    <div id="recipeBook" class="recipe-book"></div>
  </section>

  <!-- ── 쇼케이스 화면 ── -->
  <section id="screen-showcase" class="screen active">
    <div class="room-head">
      <h2 class="screen-title">✨ 마이 룸</h2>
      <button class="icon-btn" onclick="askResetAppearance()" aria-label="외형 초기화" title="외형 초기화">↺</button>
    </div>

    <div id="charStage" class="char-stage"></div>
    <div id="showcaseTier" class="showcase-tier">🌱 새싹</div>

    <div class="stat-row">
      <div class="stat-box"><div class="stat-label">✨ 비주얼</div><div id="statBeauty" class="stat-val">0</div></div>
      <div class="stat-box"><div class="stat-label">💖 아우라</div><div id="statCharm" class="stat-val">0</div></div>
      <div class="stat-box highlight"><div class="stat-label">🌟 매력 총합</div><div id="statTotal" class="stat-val">0</div></div>
    </div>

    <button class="btn btn-flex" onclick="flexCharm()">📢 매력 과시</button>

    <!-- 나의 방 하위 탭 -->
    <div class="room-tabs">
      <button class="room-tab active" data-rtab="clothes" onclick="setRoomTab('clothes')">👗 옷</button>
      <button class="room-tab" data-rtab="potions" onclick="setRoomTab('potions')">🧴 물약</button>
      <button class="room-tab" data-rtab="creatures" onclick="setRoomTab('creatures')">🦋 크리처</button>
    </div>

    <div id="roomPanel-clothes" class="room-panel active">
      <div id="wardrobe" class="wardrobe"></div>
      <div class="hint hint-block">👆 눌러서 갈아입기</div>
    </div>
    <div id="roomPanel-potions" class="room-panel">
      <div id="potionShelf" class="potion-shelf"></div>
      <div id="potionHint" class="hint hint-block">👆 눌러서 마시기</div>
    </div>
    <div id="roomPanel-creatures" class="room-panel">
      <div id="creatureCollection" class="creature-collection"></div>
    </div>

    <!-- 임시(출시 버전에서 제거): AP 충전 테스트 버튼 -->
    <button class="btn btn-dev" onclick="fillEnergy()">⚡ AP 1000 충전 (임시)</button>
  </section>

  <!-- ── 하단 탭 ── -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="showcase"><span class="tab-icon">✨</span>마이 룸</button>
    <button class="tab-btn" data-tab="atelier"><span class="tab-icon">⚗️</span>공방</button>
    <button class="tab-btn" data-tab="gather"><span class="tab-icon">🌿</span>채집</button>
  </nav>
</div>

<!-- ── 조합 결과 모달 ── -->
<div id="brewModal" class="modal">
  <div class="modal-card">
    <div id="brewModalBody"></div>
    <button class="btn btn-primary" onclick="closeBrewModal()">확인</button>
  </div>
</div>

<!-- ── 확인 모달 (바깥 터치 = 취소) ── -->
<div id="confirmModal" class="modal" onclick="if(event.target===this) closeConfirm()">
  <div class="modal-card">
    <div id="confirmText" class="confirm-text">정말로 진행할까요?</div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">취소</button>
      <button class="btn btn-primary" onclick="confirmYes()">확인</button>
    </div>
  </div>
</div>

<!-- ── 토스트 ── -->
<div id="toast" class="toast"></div>

<script src="data.js?v=20260803p"></script>
<script src="avatar.js?v=20260803p"></script>
<script src="sfx.js?v=20260803p"></script>
<script src="game.js?v=20260803p"></script>
</body>
</html>
